<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Telegram 2D Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="game" aria-label="2D гра"></canvas>
    <div id="hud">
      <div>🪙 <span id="coins">0</span></div>
      <div>❤️ <span id="lives">3</span></div>
      <div>⭐ Рівень <span id="level">1</span></div>
    </div>
    <div id="menu" class="overlay">
      <div class="card">
        <h1>🏃 Adventure</h1>
        <p>Збирай монети, перестрибуй перешкоди та уникай ворогів.</p>
        <button id="startBtn">Почати гру</button>
      </div>
    </div>
    <div id="gameOver" class="overlay hidden">
      <div class="card">
        <h2>Гру завершено</h2>
        <p>Монети: <b id="finalCoins">0</b></p>
        <p>Рівень: <b id="finalLevel">1</b></p>
        <button id="restartBtn">Грати ще</button>
      </div>
    </div>
    <div id="controls">
      <button id="leftBtn">◀</button>
      <button id="jumpBtn">▲</button>
      <button id="rightBtn">▶</button>
    </div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="game.js"></script>
</body>
</html>
