<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Pasha Dragons</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">🐉 Pasha Dragons</div>
      <div class="sub">Dragon Keeper</div>
    </div>
    <div class="wallet">
      <span>🪙 <b id="gold">500</b></span>
      <span>💎 <b id="gems">25</b></span>
    </div>
  </header>

  <main id="screen"></main>

  <nav class="tabs">
    <button data-tab="roost">🏠<small>Гніздо</small></button>
    <button data-tab="hatchery">🥚<small>Яйця</small></button>
    <button data-tab="battle">⚔️<small>Арена</small></button>
    <button data-tab="market">🛒<small>Ринок</small></button>
    <button data-tab="more">☰<small>Ще</small></button>
  </nav>

  <div id="toast"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="game.js"></script>
</body>
</html>
